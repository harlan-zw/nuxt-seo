ignoreWorkspaceRootCheck: true

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - nuxt-ai-ready@2.5.3
  - nuxt-skew-protection@1.6.2
  - nuxt-site-config-kit@4.2.3
  - nuxt-site-config@4.2.3
  - site-config-stack@4.2.3

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 262800
strictPeerDependencies: false
# pnpm reads these from pnpm-workspace.yaml, not .npmrc.
# @nuxtjs/i18n resolves its private @intlify/* + vue-i18n deps via @nuxt/kit's
# resolveModule, which only searches root node_modules, so hoist just those
# instead of shamefully-hoisting everything.
publicHoistPattern:
  - '*eslint*'
  - '*prettier*'
  - '@intlify/*'
  - vue-i18n

shellEmulator: true

packages:
  - docs
  - playground
  - packages/*
  - packages/*/playground
  - '!**/.data/**'

overrides:
  # Nitro traces several Unhead copies into one server package and can omit
  # the legacy entry imported by its compiled server bundle.
  '@unhead/bundler': ^3.4.1
  '@unhead/vue': ^3.4.1
  # Two better-sqlite3 instances exist (12.11.1 + 13.0.3); the 12.11.1
  # instance ships no native binding, so a content fixture build that traces
  # it fails every content query with "Could not locate the bindings file".
  # Pin one instance so nitro always traces the working prebuilds.
  better-sqlite3: ^13.0.3
  # Each bundled module ships its own nuxtseo-shared range, so the workspace
  # installs four copies. Nitro flattens them all into one
  # .output/server/node_modules/nuxtseo-shared, files from the losing copies are
  # dropped, and the built server exits on boot with ERR_MODULE_NOT_FOUND. Pin
  # every module to the workspace copy so there is one instance to trace.
  nuxtseo-shared: workspace:*
  rollup-plugin-dts: ^6.5.1
  semver: ^7.8.5
  unhead: ^3.4.1
  # Same failure mode as nuxtseo-shared above: the lockfile resolves two vue
  # instances (3.5.40 + 3.5.41). Nitro traces both and symlinks
  # node_modules/vue at whichever sorts first, which can be the instance
  # traced without its server-renderer subpath, so the built server exits on
  # boot with ERR_MODULE_NOT_FOUND for vue/server-renderer. Pin one version.
  vue: ^3.5.43

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  simple-git-hooks: false
  vue-demi: true

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - maplibre-gl
  - sharp
  - vue-demi
  - workerd

onlyBuiltDependencies:
  - better-sqlite3

