ignoreWorkspaceRootCheck: true

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - nuxt-ai-ready@2.5.0
  - nuxt-site-config-kit@4.2.3
  - nuxt-site-config@4.2.3
  - site-config-stack@4.2.3
  - '@nuxt/cli@4.0.0'
  - '@nuxt/kit@4.6.0'
  - '@nuxt/nitro-server@4.6.0'
  - '@nuxt/schema@4.6.0'
  - '@nuxt/vite-builder@4.6.0'
  - '@nuxt/vite-server@4.6.0'
  - nuxt@4.6.0

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 262800

trustPolicyExclude:
  - stylehacks@9.0.7
  - postcss-unique-selectors@9.0.5
  - postcss-svgo@9.0.4
  - postcss-reduce-transforms@9.0.4
  - postcss-reduce-initial@9.0.6
  - postcss-ordered-values@9.0.6
  - postcss-normalize-whitespace@9.0.5
  - postcss-normalize-url@9.0.5
  - postcss-normalize-unicode@9.0.5
  - postcss-normalize-timing-functions@9.0.5
  - postcss-normalize-string@9.0.5
  - postcss-normalize-repeat-style@9.0.5
  - postcss-normalize-positions@9.0.6
  - postcss-normalize-display-values@9.0.5
  - postcss-normalize-charset@9.0.5
  - postcss-minify-selectors@9.0.6
  - postcss-minify-params@9.0.6
  - postcss-minify-gradients@9.0.6
  - postcss-minify-font-values@9.0.7
  - postcss-merge-rules@9.0.8
  - postcss-merge-longhand@9.2.0
  - postcss-discard-overridden@9.0.5
  - postcss-discard-empty@9.0.5
  - postcss-discard-duplicates@9.0.5
  - postcss-discard-comments@9.0.6
  - postcss-convert-values@9.0.7
  - postcss-colormin@9.0.6
  - cssnano-utils@8.1.0
  - cssnano-preset-default@9.2.2
  - cssnano@9.2.2

strictPeerDependencies: false
# pnpm reads these from pnpm-workspace.yaml, not .npmrc.
# @nuxtjs/i18n resolves its private @intlify/* + vue-i18n deps via @nuxt/kit's
# resolveModule, which only searches root node_modules, so hoist just those
# instead of shamefully-hoisting everything.
publicHoistPattern:
  - '*eslint*'
  - '*prettier*'
  - '@intlify/*'
  - vue-i18n

shellEmulator: true

packages:
  - docs
  - playground
  - packages/*
  - packages/*/playground
  - '!**/.data/**'

overrides:
  # Nitro traces several Unhead copies into one server package and can omit
  # the legacy entry imported by its compiled server bundle.
  '@unhead/bundler': ^3.4.1
  '@unhead/vue': ^3.4.1
  # Two better-sqlite3 instances exist (12.11.1 + 13.0.3); the 12.11.1
  # instance ships no native binding, so a content fixture build that traces
  # it fails every content query with "Could not locate the bindings file".
  # Pin one instance so nitro always traces the working prebuilds.
  better-sqlite3: ^13.0.3
  cssnano: 9.2.2
  cssnano-preset-default: 9.2.2
  cssnano-utils: 8.1.0
  # Each bundled module ships its own nuxtseo-shared range, so the workspace
  # installs four copies. Nitro flattens them all into one
  # .output/server/node_modules/nuxtseo-shared, files from the losing copies are
  # dropped, and the built server exits on boot with ERR_MODULE_NOT_FOUND. Pin
  # every module to the workspace copy so there is one instance to trace.
  nuxtseo-shared: workspace:*
  postcss-calc: 11.2.2
  postcss-colormin: 9.0.6
  postcss-convert-values: 9.0.7
  postcss-discard-comments: 9.0.6
  postcss-discard-duplicates: 9.0.5
  postcss-discard-empty: 9.0.5
  postcss-discard-overridden: 9.0.5
  postcss-merge-longhand: 9.2.0
  postcss-merge-rules: 9.0.8
  postcss-minify-font-values: 9.0.7
  postcss-minify-gradients: 9.0.6
  postcss-minify-params: 9.0.6
  postcss-minify-selectors: 9.0.6
  postcss-normalize-charset: 9.0.5
  postcss-normalize-display-values: 9.0.5
  postcss-normalize-positions: 9.0.6
  postcss-normalize-repeat-style: 9.0.5
  postcss-normalize-string: 9.0.5
  postcss-normalize-timing-functions: 9.0.5
  postcss-normalize-unicode: 9.0.5
  postcss-normalize-url: 9.0.5
  postcss-normalize-whitespace: 9.0.5
  postcss-ordered-values: 9.0.6
  postcss-reduce-initial: 9.0.6
  postcss-reduce-transforms: 9.0.4
  postcss-svgo: 9.0.4
  postcss-unique-selectors: 9.0.5
  rollup-plugin-dts: ^6.5.1
  semver: ^7.8.5
  stylehacks: 9.0.7
  unhead: ^3.4.1
  # Same failure mode as nuxtseo-shared above: the lockfile resolves two vue
  # instances (3.5.40 + 3.5.41). Nitro traces both and symlinks
  # node_modules/vue at whichever sorts first, which can be the instance
  # traced without its server-renderer subpath, so the built server exits on
  # boot with ERR_MODULE_NOT_FOUND for vue/server-renderer. Pin one version.
  vue: ^3.5.43

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  simple-git-hooks: false
  vue-demi: true

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - maplibre-gl
  - sharp
  - vue-demi
  - workerd

onlyBuiltDependencies:
  - better-sqlite3

