ignoreWorkspaceRootCheck: true
blockExoticSubdeps: false

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@nuxt/kit@4.6.1'
  - '@nuxt/nitro-server@4.6.1'
  - '@nuxt/schema@4.6.1'
  - '@nuxt/vite-builder@4.6.1'
  - '@nuxt/vite-server@4.6.1'
  - nuxt@4.6.1
  - '@harlan-zw/comark-content@0.2.0'
  - '@nuxt/devtools-kit@4.0.0-beta.4'
  - '@nuxtjs/robots@7.0.0'
  - '@nuxtjs/sitemap@9.0.0'
  - nuxt-link-checker@6.0.0
  - nuxt-og-image@7.0.0
  - nuxt-schema-org@7.0.0
  - nuxt-seo-utils@9.0.0
  - nuxt-site-config-kit@5.0.1
  - nuxt-site-config@5.0.1
  - site-config-stack@5.0.0 || 5.0.1

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 262800

trustPolicyExclude:
  - stylehacks@9.0.7
  - postcss-unique-selectors@9.0.5
  - postcss-svgo@9.0.4
  - postcss-reduce-transforms@9.0.4
  - postcss-reduce-initial@9.0.6
  - postcss-ordered-values@9.0.6
  - postcss-normalize-whitespace@9.0.5
  - postcss-normalize-url@9.0.5
  - postcss-normalize-unicode@9.0.5
  - postcss-normalize-timing-functions@9.0.5
  - postcss-normalize-string@9.0.5
  - postcss-normalize-repeat-style@9.0.5
  - postcss-normalize-positions@9.0.6
  - postcss-normalize-display-values@9.0.5
  - postcss-normalize-charset@9.0.5
  - postcss-minify-selectors@9.0.6
  - postcss-minify-params@9.0.6
  - postcss-minify-gradients@9.0.6
  - postcss-minify-font-values@9.0.7
  - postcss-merge-rules@9.0.8
  - postcss-merge-longhand@9.2.0
  - postcss-discard-overridden@9.0.5
  - postcss-discard-empty@9.0.5
  - postcss-discard-duplicates@9.0.5
  - postcss-discard-comments@9.0.6
  - postcss-convert-values@9.0.7
  - postcss-colormin@9.0.6
  - cssnano-utils@8.1.0
  - cssnano-preset-default@9.2.2
  - cssnano@9.2.2

strictPeerDependencies: false

publicHoistPattern:
  - '*eslint*'
  - '*prettier*'
  - '@intlify/*'
  - vue-i18n

shellEmulator: true

packages:
  - docs
  - playground
  - packages/*
  - packages/*/playground
  - '!**/.data/**'

overrides:
  '@nuxt/kit': ^4.6.1
  '@nuxt/schema': ^4.6.1
  '@unhead/bundler': ^3.4.1
  '@unhead/vue': ^3.4.1
  better-sqlite3: ^13.0.3
  cssnano: 9.2.2
  cssnano-preset-default: 9.2.2
  cssnano-utils: 8.1.0
  # nuxt-skew-protection 2.0.0 and nuxt-ai-ready 3.0.0 are not on npm yet.
  # Keep the immutable previews they resolve through until they publish.
  nuxt-ai-ready: https://pkg.pr.new/harlan-zw/nuxt-ai-ready/nuxt-ai-ready@289a8736bed45c791ae832aad6b7050037ffb7e7
  nuxt-skew-protection: https://pkg.pr.new/harlan-zw/nuxt-skew-protection/nuxt-skew-protection@96c9b6a8ab2d2f5a0ca133ff4638c007ecba80af
  # Each bundled module ships its own nuxtseo-shared range, so the workspace
  # installs several copies. Nitro flattens them all into one
  # .output/server/node_modules/nuxtseo-shared, files from the losing copies are
  # dropped, and the built server exits on boot with ERR_MODULE_NOT_FOUND. Pin
  # every module to the workspace copy so there is one instance to trace.
  nuxtseo-shared: workspace:*
  postcss-calc: 11.2.2
  postcss-colormin: 9.0.6
  postcss-convert-values: 9.0.7
  postcss-discard-comments: 9.0.6
  postcss-discard-duplicates: 9.0.5
  postcss-discard-empty: 9.0.5
  postcss-discard-overridden: 9.0.5
  postcss-merge-longhand: 9.2.0
  postcss-merge-rules: 9.0.8
  postcss-minify-font-values: 9.0.7
  postcss-minify-gradients: 9.0.6
  postcss-minify-params: 9.0.6
  postcss-minify-selectors: 9.0.6
  postcss-normalize-charset: 9.0.5
  postcss-normalize-display-values: 9.0.5
  postcss-normalize-positions: 9.0.6
  postcss-normalize-repeat-style: 9.0.5
  postcss-normalize-string: 9.0.5
  postcss-normalize-timing-functions: 9.0.5
  postcss-normalize-unicode: 9.0.5
  postcss-normalize-url: 9.0.5
  postcss-normalize-whitespace: 9.0.5
  postcss-ordered-values: 9.0.6
  postcss-reduce-initial: 9.0.6
  postcss-reduce-transforms: 9.0.4
  postcss-svgo: 9.0.4
  postcss-unique-selectors: 9.0.5
  rollup-plugin-dts: ^6.5.1
  semver: ^7.8.5

  stylehacks: 9.0.7
  unhead: ^3.4.1
  vue: ^3.5.43

# Temporary metadata for immutable previews. Remove when the majors reach npm.
patchedDependencies:
  nuxt-ai-ready@2.5.3: patches/previews/nuxt-ai-ready@2.5.3.patch
  nuxt-skew-protection@1.6.2: patches/previews/nuxt-skew-protection@1.6.2.patch

allowBuilds:
  '@firebase/util': false
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  protobufjs: false
  sharp: true
  simple-git-hooks: false
  unrs-resolver: false
  vue-demi: true
  workerd: false

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - maplibre-gl
  - sharp
  - vue-demi
  - workerd

onlyBuiltDependencies:
  - better-sqlite3

