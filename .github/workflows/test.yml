name: CI

on:
  # Every push. reusable-ci.yml skips its jobs when only docs change, so the
  # required checks still report.
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-size-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411 # v2.0.1
        with:
          runtime: node@24
          install: false
      - run: node --test .github/actions/package-size-report/*.test.*
  ci:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      playwright: false
      test-command: pnpm test:run
      # Throwaway proof only. This branch also carries the unmerged workflow change from
      # #675, so its diff against main ignores the workflow files as well.
      paths-ignore: |
        **/README.md
        docs/**
        .github/workflows/**
        scripts/workflows/**
