name: Reusable CI

on:
  workflow_call:
    inputs:
      runner:
        description: Runner to use
        type: string
        default: ubuntu-24.04-arm
      node-version:
        description: Node.js version
        type: string
        default: lts
      test-command:
        description: Test command
        type: string
        default: pnpm test
      typecheck-command:
        description: Typecheck command
        type: string
        default: pnpm typecheck
      prepare-command:
        description: Dev prepare command
        type: string
        default: 'pnpm dev:prepare'
      redis:
        description: Enable Redis service container for tests
        type: boolean
        default: false
      playwright:
        description: Install Playwright browsers before tests (disable for repos with no
          browser tests)
        type: boolean
        default: true
      paths-ignore:
        description: Globs, one per line. If a change touches only matching paths, lint,
          typecheck, build and test skip and their checks still pass.
        type: string
        default: |
          **/README.md
          docs/**

env:
  # Retry registry requests instead of failing the job on a transient 5xx.
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '20000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'

jobs:
  # Decides whether the other jobs run. A job skipped by `if:` still reports its
  # `ci / <job>` check as passed, so a docs-only pull request can merge. An event-level
  # `paths-ignore` skips the whole workflow instead, and the required checks never report.
  changes:
    runs-on: ${{ inputs.runner }}
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # All commits and trees, for the merge base. The diff reads names only and
          # skips rename detection, so it needs no blobs.
          fetch-depth: 0
          filter: blob:none
      - id: diff
        env:
          PATHS_IGNORE: ${{ inputs.paths-ignore }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          base=
          head=$GITHUB_SHA
          if [ -n "$PR_BASE" ]; then
            # Pull request: the files the pull request changes.
            base=$PR_BASE
            head=$PR_HEAD
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; then
            if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
              # Default branch: every job runs, docs-only pushes too. A skipped run on a
              # docs commit would report main green while the code commit before it failed.
              echo "Push to $DEFAULT_BRANCH. Every job runs."
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
            else
              # Other branch, new or not: everything it changes against the default branch.
              # A diff of this push alone would let a docs commit turn a red pull request green.
              base=origin/$DEFAULT_BRANCH
            fi
          fi

          # A tag, a manual run, a new default branch: no base, so every job runs.
          if [ -z "$base" ] || [ -z "${base//0/}" ]; then
            echo "No diff base for this $GITHUB_EVENT_NAME event. Every job runs."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pathspec=(.)
          while read -r pattern; do
            [ -n "$pattern" ] && pathspec+=(":(exclude,glob)$pattern")
          done <<< "$PATHS_IGNORE"

          if ! changed=$(git diff --no-renames --name-only "$base...$head" -- "${pathspec[@]}"); then
            echo "::warning::Cannot diff $base...$head. Every job runs."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$changed" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only ignored paths changed in $base...$head. Lint, typecheck, build and test skip."
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "$(wc -l <<< "$changed") paths changed in $base...$head outside paths-ignore, for example:"
            sed -n '1,20p' <<< "$changed"
          fi

  lint:
    needs: changes
    # `!cancelled()` replaces the implicit `success()`: if `changes` fails, the job runs.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ inputs.node-version }}
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile --trust-lockfile
      - run: pnpm lint

  typecheck:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ inputs.node-version }}
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile --trust-lockfile
      - run: ${{ inputs.prepare-command }}
      - run: ${{ inputs.typecheck-command }}
      - run: pnpm run --if-present test:attw

  build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ inputs.node-version }}
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile --trust-lockfile
      - run: ${{ inputs.prepare-command }}
      - run: pnpm build

  test:
    needs: changes
    if: ${{ !cancelled() && !inputs.redis && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ inputs.node-version }}
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile --trust-lockfile
      - run: ${{ inputs.prepare-command }}

      - name: Cache Playwright browsers
        id: playwright-cache
        if: ${{ inputs.playwright }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ inputs.runner }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: ${{ inputs.playwright && steps.playwright-cache.outputs.cache-hit != 'true'
          }}
        # The arm64 chromium download from cdn.playwright.dev can stall indefinitely;
        # bound each attempt and retry so a flaky CDN doesn't wedge the job for hours.
        run: |
          for attempt in 1 2 3; do
            echo "::group::Playwright install attempt $attempt"
            if timeout 300 pnpm exec playwright-core install chromium; then
              echo "::endgroup::"
              exit 0
            fi
            echo "attempt $attempt stalled or failed, retrying" && echo "::endgroup::"
          done
          echo "Playwright install failed after 3 attempts"
          exit 1
        timeout-minutes: 18
        continue-on-error: true

      - run: pnpm run --if-present prepare:fixtures
      - run: ${{ inputs.test-command }}

  test-redis:
    needs: changes
    if: ${{ !cancelled() && inputs.redis && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ inputs.runner }}
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout
          5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ inputs.node-version }}
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile --trust-lockfile
      - run: ${{ inputs.prepare-command }}

      - name: Cache Playwright browsers
        id: playwright-cache
        if: ${{ inputs.playwright }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ inputs.runner }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: ${{ inputs.playwright && steps.playwright-cache.outputs.cache-hit != 'true'
          }}
        # The arm64 chromium download from cdn.playwright.dev can stall indefinitely;
        # bound each attempt and retry so a flaky CDN doesn't wedge the job for hours.
        run: |
          for attempt in 1 2 3; do
            echo "::group::Playwright install attempt $attempt"
            if timeout 300 pnpm exec playwright-core install chromium; then
              echo "::endgroup::"
              exit 0
            fi
            echo "attempt $attempt stalled or failed, retrying" && echo "::endgroup::"
          done
          echo "Playwright install failed after 3 attempts"
          exit 1
        timeout-minutes: 18
        continue-on-error: true

      - run: pnpm run --if-present prepare:fixtures
      - run: ${{ inputs.test-command }}
