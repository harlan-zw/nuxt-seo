name: Foundation Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Foundation package selection
        type: choice
        options: [all, nuxtseo-shared, nuxtseo-layer-devtools, nuxtseo-devtools-host]
        default: all
      publish:
        description: Publish the verified foundation archives to npm
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/checkout@v7
        with:
          repository: harlan-zw/nuxt-site-config
          ref: 235a0808bcc419ab4b7f15be4708e7251bab003d
          path: site-source
      - uses: pnpm/setup@v2
        with:
          runtime: node@22.22.3
          package-json-file: source/package.json
          install: false
      - name: Check bootstrap boundaries
        env:
          FOUNDATION_TEST_SITE_SOURCE: ${{ github.workspace }}/site-source
        run: node --test source/scripts/foundation-config.test.ts
      - name: Verify, build, test and pack foundations
        run: >-
          node source/scripts/bootstrap-foundation.ts
          --output "${{ runner.temp }}/foundation"
          --site-source "${{ github.workspace }}/site-source"
          --mode pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-release-archives
          path: ${{ runner.temp }}/foundation/artifacts
          if-no-files-found: error
      - name: Publish the selected foundation archives
        if: ${{ inputs.publish }}
        env:
          FOUNDATION_PACKAGE: ${{ inputs.package }}
        run: >-
          node source/scripts/foundation-release.ts
          "${{ runner.temp }}/foundation/artifacts"
          "$FOUNDATION_PACKAGE"
