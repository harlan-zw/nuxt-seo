name: Foundation CI

on:
  pull_request:
    paths:
      - 'packages/shared/**'
      - 'packages/devtools-host/**'
      - 'packages/devtools-layer/**'
      - 'scripts/foundation*'
      - 'scripts/bootstrap*'
      - 'scripts/migration*'
      - '.github/actions/migration-ci/**'
      - '.github/actions/package-size-report/**'
      - pnpm-workspace.yaml
      - package.json
      - .github/workflows/foundation-ci.yml
      - .github/workflows/foundation-release.yml
      - '!**/*.md'
  push:
    branches: [main]
    paths:
      - 'packages/shared/**'
      - 'packages/devtools-host/**'
      - 'packages/devtools-layer/**'
      - 'scripts/foundation*'
      - 'scripts/bootstrap*'
      - 'scripts/migration*'
      - '.github/actions/migration-ci/**'
      - '.github/actions/package-size-report/**'
      - pnpm-workspace.yaml
      - package.json
      - .github/workflows/foundation-ci.yml
      - .github/workflows/foundation-release.yml
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        node: [22.22.3, 24.15.0]
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/checkout@v7
        with:
          repository: harlan-zw/nuxt-site-config
          ref: 235a0808bcc419ab4b7f15be4708e7251bab003d
          path: site-source
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node }}
          package-json-file: source/package.json
          install: false
      - name: Check bootstrap boundaries
        env:
          FOUNDATION_TEST_SITE_SOURCE: ${{ github.workspace }}/site-source
        run: >-
          node --test
          source/scripts/foundation-config.test.ts
          source/scripts/migration-config.test.ts
          source/.github/actions/package-size-report/report.test.mjs
          source/.github/actions/package-size-report/migration.test.ts
      - name: Verify, build, test and pack foundations
        run: >-
          node source/scripts/bootstrap-foundation.ts
          --output "${{ runner.temp }}/foundation"
          --site-source "${{ github.workspace }}/site-source"
          --mode pack
      - name: Verify native producer type scope
        env:
          MIGRATION_SCOPE_TOOL_ROOT: ${{ runner.temp }}/foundation/site/packages/module
        run: node --test source/scripts/migration-scope.test.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundations-node-${{ matrix.node }}
          path: ${{ runner.temp }}/foundation/artifacts
          if-no-files-found: error
