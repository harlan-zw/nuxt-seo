name: Release

on:
  push:
    tags:
      - 'v*'
      - 'shared-v*'

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/reusable-release.yml
    with:
      monorepo: true
      pre-build-command: pnpm dev:prepare

  shared:
    if: startsWith(github.ref, 'refs/tags/shared-v')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@lts
          cache: true
          install: false
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module-typescript -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("packages/shared/package.json", "utf8")) as { version: string };
            if (process.env.RELEASE_TAG !== "shared-v" + version) {
              throw new Error("The Shared release tag must match its package version.");
            }
          '
      - run: pnpm install --frozen-lockfile --trust-lockfile
      - run: pnpm --filter nuxtseo-shared build
      - run: pnpm --filter nuxtseo-shared test:run
      - run: pnpm --filter nuxtseo-shared publish --access public --no-git-checks --provenance
