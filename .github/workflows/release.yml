name: Release

on:
  push:
    tags:
      - 'v*'
      - 'shared-v*'
      - 'devtools-v*'
      - 'host-v*'

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/reusable-release.yml
    with:
      monorepo: true
      publish-filter: '@nuxtjs/seo'
      pre-build-command: pnpm dev:prepare

  shared:
    if: startsWith(github.ref, 'refs/tags/shared-v')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@lts
          cache: true
          install: false
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module-typescript -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("packages/shared/package.json", "utf8")) as { version: string };
            if (process.env.RELEASE_TAG !== "shared-v" + version) {
              throw new Error("The Shared release tag must match its package version.");
            }
          '
      - run: pnpm install --frozen-lockfile --trust-lockfile
      - run: pnpm --filter nuxtseo-shared build
      - run: pnpm --filter nuxtseo-shared test:run
      - run: pnpm --filter nuxtseo-shared publish --access public --no-git-checks --provenance

  devtools:
    if: startsWith(github.ref, 'refs/tags/devtools-v')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@lts
          cache: true
          install: false
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module-typescript -e '
            import { readFileSync } from "node:fs";
            const layer = JSON.parse(readFileSync("packages/devtools-layer/package.json", "utf8")) as { version: string };
            if (process.env.RELEASE_TAG !== "devtools-v" + layer.version) {
              throw new Error("The DevTools release tag must match its layer version.");
            }
          '
      - run: pnpm install --frozen-lockfile --trust-lockfile
      - run: pnpm --filter nuxtseo-shared build
      - run: pnpm --filter nuxtseo-layer-devtools test:run
      - run: pnpm -r --filter nuxtseo-layer-devtools publish --access public --no-git-checks --provenance

  host:
    if: startsWith(github.ref, 'refs/tags/host-v')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@lts
          cache: true
          install: false
      - name: Check release version and published dependencies
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module-typescript - <<'TS'
          import { readFileSync } from "node:fs";
          const host = JSON.parse(readFileSync("packages/devtools-host/package.json", "utf8")) as { version: string };
          if (process.env.RELEASE_TAG !== "host-v" + host.version) {
            throw new Error("The Host release tag must match its package version.");
          }
          for (const path of ["packages/shared/package.json", "packages/devtools-layer/package.json"]) {
            const { name, version } = JSON.parse(readFileSync(path, "utf8")) as { name: string; version: string };
            const response = await fetch("https://registry.npmjs.org/" + encodeURIComponent(name) + "/" + version, {
              signal: AbortSignal.timeout(10_000),
            });
            if (!response.ok) {
              throw new Error("Publish " + name + "@" + version + " before releasing Host.");
            }
          }
          TS
      - run: pnpm install --frozen-lockfile --trust-lockfile
      - run: pnpm --filter nuxtseo-shared build
      - run: pnpm --filter nuxtseo-devtools-host build
      - run: pnpm --filter nuxtseo-devtools-host typecheck
      - run: pnpm --filter nuxtseo-devtools-host test:run
      - run: pnpm -r --filter nuxtseo-devtools-host publish --access public --no-git-checks --provenance
