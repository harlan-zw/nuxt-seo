name: Deploy Docs

on:
  push:
    # nuxtseo.com reads docs from main, so only a main push has new docs to deploy.
    # A branch push would trigger a full production deploy with unchanged docs.
    branches:
      - main
    paths:
      - 'docs/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger nuxtseo.com deploy
        run: |
          # --fail-with-body: a rejected dispatch (for example a 401 from an expired token) fails the job
          curl --fail-with-body -X POST \
            -H "Authorization: token ${{ secrets.NUXTSEO_DEPLOY_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/nuxt-seo-pro/nuxtseo.com/dispatches \
            -d '{"event_type":"docs-updated"}'
