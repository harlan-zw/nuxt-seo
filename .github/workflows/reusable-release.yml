name: Reusable Release

on:
  workflow_call:
    inputs:
      runner:
        description: Runner to use
        type: string
        default: ubuntu-24.04-arm
      node-version:
        description: Node.js version
        type: string
        default: lts
      monorepo:
        description: Use pnpm publish -r for monorepo publishing
        type: boolean
        default: false
      pre-build-command:
        description: Command to run before build (e.g. npx nuxt prepare)
        type: string
        default: ''

permissions:
  contents: write
  id-token: write

env:
  # Retry registry requests instead of failing the job on a transient 5xx.
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '20000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'

jobs:
  release:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ inputs.node-version }}
          cache: true
          install: false

      # A transient GitHub API error here must not abort a release that has
      # already been tagged.
      - name: Publish release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if npx changelogithub; then
              exit 0
            fi
            echo "::warning::changelogithub failed on attempt $attempt"
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          echo "::error::changelogithub failed after 3 attempts"
          exit 1

      - run: pnpm install --frozen-lockfile --trust-lockfile

      - if: ${{ inputs.pre-build-command != '' }}
        run: ${{ inputs.pre-build-command }}

      - run: pnpm build

      - name: Detect prerelease tag
        id: prerelease
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ -(beta|rc|alpha) ]]; then
            DIST_TAG=$(echo "$TAG" | sed 's/.*-\(beta\|rc\|alpha\).*/\1/')
            echo "tag=--tag $DIST_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ inputs.monorepo }}
        run: pnpm publish -r --access public --no-git-checks --provenance ${{
          steps.prerelease.outputs.tag }}

      - if: ${{ !inputs.monorepo }}
        run: pnpm publish --access public --no-git-checks --provenance ${{
          steps.prerelease.outputs.tag }}
