name: Reusable Nightly

on:
  workflow_call:
    inputs:
      runner:
        description: Runner to use
        type: string
        default: ubuntu-latest
      node-version:
        description: Node.js version
        type: string
        default: lts
      pre-build-command:
        description: Command to run before build
        type: string
        default: ''
      prepare-command:
        description: Dev prepare command
        type: string
        default: 'pnpm dev:prepare'
      publish-packages:
        description: Space-separated list of package paths to publish (leave empty to
          publish all)
        type: string
        default: ''

permissions:
  contents: read

env:
  # Retry registry requests instead of failing the job on a transient 5xx.
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '20000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ inputs.node-version }}
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile --trust-lockfile
      - run: ${{ inputs.prepare-command }}

      - if: ${{ inputs.pre-build-command != '' }}
        run: ${{ inputs.pre-build-command }}

      - run: pnpm build

      # pkg.pr.new is a third party service. It returns transient 5xx errors
      # that survive the publisher's own retries. Retry here so an outage does
      # not fail the default branch build.
      - name: Publish
        env:
          PUBLISH_PACKAGES: ${{ inputs.publish-packages }}
        run: |
          for attempt in 1 2 3 4 5; do
            echo "::group::pkg-pr-new publish attempt $attempt"
            if pnpm dlx pkg-pr-new publish --pnpm $PUBLISH_PACKAGES; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::pkg-pr-new publish failed on attempt $attempt"
            if [ "$attempt" -lt 5 ]; then
              sleep 30
            fi
          done
          echo "::error::pkg-pr-new publish failed after 5 attempts"
          exit 1
