linkWorkspacePackages: false
preferWorkspacePackages: false
# pkg.pr.new monorepo previews reference their sibling preview tarballs.
blockExoticSubdeps: false

minimumReleaseAgeExclude:
  - nuxt-ai-ready@1.7.3
  - nuxtseo-shared@5.3.10
  - '@rolldown/binding-android-arm64@1.2.2'
  - nuxt-site-config-kit@4.1.4
  - nuxt-site-config@4.1.4
  - site-config-stack@4.1.4
  - sitemapd@0.2.1

overrides:
  '@nuxt/kit': 4.5.1
  '@nuxt/nitro-server': 4.5.1
  '@nuxt/schema': 4.5.1
  '@nuxt/vite-builder': 4.5.1
  nuxt: 4.5.1

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - sharp

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
