linkWorkspacePackages: false
preferWorkspacePackages: false
blockExoticSubdeps: false

minimumReleaseAgeExclude:
  - nuxt-ai-ready@2.5.0
  - nuxt-site-config-kit@4.2.3
  - nuxt-site-config@4.2.3
  - site-config-stack@4.2.3

overrides:
  nuxtseo-shared: file:../nitro-parity/nuxtseo-shared.tgz
  '@nuxt/kit': 3.21.11
  '@nuxt/nitro-server': 3.21.11
  '@nuxt/schema': 3.21.11
  '@nuxt/vite-builder': 3.21.11
  nuxt: 3.21.11

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - sharp

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
